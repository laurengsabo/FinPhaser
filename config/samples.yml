# ============================================================
#  FinPhaser — Sample Configuration  (config/samples.yml)
# ============================================================
#  This file and your starting VCF are the ONLY two inputs the
#  pipeline needs. Everything else is derived from these.
#
#  Run the full pipeline with:
#    nextflow run main.nf -profile conda \
#        --vcf         data/raw/YHPedigree1_FilteredSNVs.recode.vcf \
#        --samples_yml config/samples.yml
#
# ── Biological context ───────────────────────────────────────
#  Yellow Head cichlid (Aulonocara sp. 'Yellow Head') x
#  Mchenga conophoros backcross.
#
#  A chromosomal inversion on LG10 is linked to sex
#  determination. This cross isolates parental haplotypes so
#  their inheritance in F1 offspring can be tracked.
#
#  ancestry_hmm: infers which parental haplotype each offspring
#    inherited at each genomic site (uses population field).
#
#  SPORE + TRUFFLE: assesses IBD/inbreeding among offspring,
#    because the lab stock has been inbred across many
#    generations and the degree of inbreeding is unknown
#    (uses sex field).
#
# ── VCF data flow ────────────────────────────────────────────
#  YHPedigree1_FilteredSNVs.recode.vcf   ← single starting VCF
#    │
#    ▼ PhaseParents_VCF.py
#  YHPed1_conserved_phased.vcf
#    ├──▶ mod_vcf2ahmm.py → ancestry_hmm   (AHMM branch)
#    └──▶ bgzip + tabix  → SPORE/TRUFFLE   (IBD branch)
#
# ── Parent → haplotype mapping ───────────────────────────────
#  Each diploid parent contributes TWO haplotypes, so it appears
#  TWICE in the populations list.
#
#    YH_006_f  →  0  (maternal haplotype 1)
#    YH_006_f  →  1  (maternal haplotype 2)
#    YH_011_m  →  2  (paternal haplotype 1)
#    YH_011_m  →  3  (paternal haplotype 2)
#    offspring →  admixed
#
# ── Field guide ──────────────────────────────────────────────
#  sample     : must EXACTLY match the VCF column header
#  population : 0/1/2/3 (reference haplotype) or admixed
#               parents appear twice, once per haplotype
#               used by ancestry_hmm only
#  sex        : M, F, or Q (unknown)
#               used by SPORE only
#
# ── Notes ────────────────────────────────────────────────────
#  YH_034, YH_035, YH_036 absent from source data — excluded.
#  SPORE cannot handle underscores in sample names; the pipeline
#  strips them automatically (YH_016 → YH016) when writing the
#  sex metadata TSV. No manual fix needed.
# ============================================================

# ── ancestry_hmm / mod_vcf2ahmm parameters ───────────────────
# Passed as CLI flags to mod_vcf2ahmm.py (your unmodified script).
hmm:
  recombination_rate: 1.0e-8    # -r  Morgans/bp
  min_distance_bp: 1000         # -m  min bp between adjacent kept SNPs
  min_allele_freq_diff: 0.1     # --min_diff  min freq diff between haplotypes
  use_genotypes: 0              # -g  0 = use read counts, 1 = use genotypes

# ── SPORE / TRUFFLE parameters ────────────────────────────────
# These are written verbatim into the auto-generated SPORE-Settings.R.
# See SPORE README for parameter descriptions.
spore:
  # ── TRUFFLE executable ──────────────────────────────────────
  # Path to the truffle binary on your system.
  # If you put it in the repo at tools/truffle, use:
  #   truffle_path: "tools/truffle"
  # Otherwise provide the absolute path on your machine.
  truffle_path: "tools/truffle"

  # ── TRUFFLE filters ─────────────────────────────────────────
  truffle_maf: 0.05             # minor allele frequency filter
  truffle_missing: 0.95         # max missingness allowed

  # ── SPORE sensitivity ───────────────────────────────────────
  # APO = assumed number of offspring per individual.
  # Think of it as the average expected family size in this
  # population. Affects detection sensitivity.
  APO: 24

  # ── Sampling mode ───────────────────────────────────────────
  intermediate_sampling_mode: FALSE   # TRUE = Extensive, FALSE = Intermediate

  # ── Memory / parallelism ────────────────────────────────────
  max_memory: "4G"
  max_cores: 4

  # ── Output settings ─────────────────────────────────────────
  # Label used by SPORE when naming its own output files
  # (e.g. <label>-truffle.ibd). Does NOT affect the input VCF name.
  output_label: "YHPed1_spore"          # prefix for SPORE output files
  pedigree_file_add_name: ""          # optional suffix to distinguish runs
  plots: TRUE                         # save IBD threshold plots

  # ── Filtering thresholds ────────────────────────────────────
  min_loci: 1                         # min overlapping loci to include a pair
  IBD2_DP_threshold: 0.95             # IBD2 % above which = duplicate sample
  downsample_for_homozygous_mendel: 1 # downsampling to reduce memory load

  # ── Optional inputs ─────────────────────────────────────────
  birthdate_file: ""                  # leave empty if no birthdates available
  extra_variables: "none"             # path to extra variables file or "none"

  # ── Advanced: disable default SPORE variables ───────────────
  no_IBD0: FALSE
  no_IQR: FALSE
  no_HM: FALSE

  # ── Advanced: resume a previous partial run ─────────────────
  # Set to TRUE only if re-running after a previous partial run.
  previously_computed: FALSE
  previously_computed_homozygous_mendel: FALSE
  previously_computed_mendel: FALSE
  previously_computed_three_thresholds: FALSE

# ── Sample population and sex assignments ─────────────────────
# Parents appear TWICE (one entry per haplotype contributed).
# Offspring appear ONCE with population: admixed.
populations:

  # ── Female parent ────────────────────────────────────────────
  - sample: "YH_006_f"
    population: 0        # maternal haplotype 1
    sex: F
  - sample: "YH_006_f"
    population: 1        # maternal haplotype 2
    sex: F

  # ── Male parent ──────────────────────────────────────────────
  - sample: "YH_011_m"
    population: 2        # paternal haplotype 1
    sex: M
  - sample: "YH_011_m"
    population: 3        # paternal haplotype 2
    sex: M

  # ── Admixed offspring ─────────────────────────────────────────
  - { sample: "YH_016", population: admixed, sex: F }
  - { sample: "YH_017", population: admixed, sex: F }
  - { sample: "YH_018", population: admixed, sex: F }
  - { sample: "YH_019", population: admixed, sex: F }
  - { sample: "YH_020", population: admixed, sex: F }
  - { sample: "YH_021", population: admixed, sex: F }
  - { sample: "YH_022", population: admixed, sex: F }
  - { sample: "YH_023", population: admixed, sex: F }
  - { sample: "YH_024", population: admixed, sex: F }
  - { sample: "YH_025", population: admixed, sex: M }
  - { sample: "YH_026", population: admixed, sex: M }
  - { sample: "YH_027", population: admixed, sex: M }
  - { sample: "YH_028", population: admixed, sex: M }
  - { sample: "YH_029", population: admixed, sex: M }
  - { sample: "YH_030", population: admixed, sex: M }
  - { sample: "YH_031", population: admixed, sex: F }
  - { sample: "YH_032", population: admixed, sex: F }
  - { sample: "YH_033", population: admixed, sex: F }
  # YH_034, YH_035, YH_036 — absent from source data; excluded
  - { sample: "YH_037", population: admixed, sex: M }
  - { sample: "YH_038", population: admixed, sex: M }
  - { sample: "YH_039", population: admixed, sex: M }
  - { sample: "YH_040", population: admixed, sex: M }
  - { sample: "YH_041", population: admixed, sex: M }
  - { sample: "YH_042", population: admixed, sex: M }