# ============================================================
#  FinPhaser — Test Configuration  (config/test_samples.yml)
# ============================================================
#  Used by the bundled test dataset profile:
#    nextflow run main.nf -profile test
#
#  This config points to the small test VCF in data/test/ and
#  exercises all pipeline steps end-to-end. Expected runtime:
#    - ancestry_hmm   : ~10–20 minutes
#    - SPORE/TRUFFLE  : ~5–10 minutes
#    - All other steps: < 5 minutes total
#
#  The test VCF contains 50,000 SNPs from the first chromosome
#  of YHPedigree1_FilteredSNVs.recode.vcf, bgzipped.
# ============================================================

# ── Input VCF ────────────────────────────────────────────────
vcf: "data/test/test_FilteredSNVs.recode.vcf.gz"

# ── Chromosome → linkage group mapping ───────────────────────
linkage_groups:
  NC_036780.1: LG1
  NC_036781.1: LG2
  NC_036782.1: LG3
  NC_036783.1: LG4
  NC_036784.1: LG5
  NC_036785.1: LG6
  NC_036786.1: LG7
  NC_036787.1: LG8
  NC_036788.1: LG9
  NC_036789.1: LG10
  NC_036790.1: LG11
  NC_036791.1: LG12
  NC_036792.1: LG13
  NC_036793.1: LG14
  NC_036794.1: LG15
  NC_036796.1: LG17
  NC_036797.1: LG18
  NC_036798.1: LG19
  NC_036799.1: LG20
  NC_036800.1: LG22
  NC_036801.1: LG23

# ── ancestry_hmm / mod_vcf2ahmm parameters ───────────────────
hmm:
  recombination_rate: 1.0e-8
  min_distance_bp: 1000
  min_allele_freq_diff: 0.1
  use_genotypes: 0

# ── SPORE / TRUFFLE settings ──────────────────────────────────
spore:
  truffle_path: "tools/truffle/truffle"
  truffle_maf: 0.05
  truffle_missing: 0.95
  APO: 24
  intermediate_sampling_mode: FALSE
  max_memory: "4G"
  max_cores: 4
  output_label: "test_run"
  pedigree_file_add_name: ""
  birthdate_file: ""
  plots: FALSE
  min_loci: 1
  IBD2_DP_threshold: 0.95
  downsample_for_homozygous_mendel: 1
  extra_variables: "none"
  # IQR thresholding disabled for test data — too few variants
  # per chromosome after subsetting to 50k SNPs
  no_IBD0: FALSE
  no_IQR: TRUE
  no_HM: TRUE
  previously_computed: FALSE
  previously_computed_homozygous_mendel: FALSE
  previously_computed_mendel: FALSE
  previously_computed_three_thresholds: FALSE

# ── Sample population and sex assignments ─────────────────────
populations:
  - sample: "YH_006_f"
    population: 0
    sex: F
  - sample: "YH_006_f"
    population: 1
    sex: F
  - sample: "YH_011_m"
    population: 2
    sex: M
  - sample: "YH_011_m"
    population: 3
    sex: M
  - { sample: "YH_016", population: admixed, sex: F }
  - { sample: "YH_017", population: admixed, sex: F }
  - { sample: "YH_018", population: admixed, sex: F }
  - { sample: "YH_019", population: admixed, sex: F }
  - { sample: "YH_020", population: admixed, sex: F }
  - { sample: "YH_021", population: admixed, sex: F }
  - { sample: "YH_022", population: admixed, sex: F }
  - { sample: "YH_023", population: admixed, sex: F }
  - { sample: "YH_024", population: admixed, sex: F }
  - { sample: "YH_025", population: admixed, sex: M }
  - { sample: "YH_026", population: admixed, sex: M }
  - { sample: "YH_027", population: admixed, sex: M }
  - { sample: "YH_028", population: admixed, sex: M }
  - { sample: "YH_029", population: admixed, sex: M }
  - { sample: "YH_030", population: admixed, sex: M }
  - { sample: "YH_031", population: admixed, sex: F }
  - { sample: "YH_032", population: admixed, sex: F }
  - { sample: "YH_033", population: admixed, sex: F }
  - { sample: "YH_037", population: admixed, sex: M }
