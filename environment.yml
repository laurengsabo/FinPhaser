name: FinPhaser
# ============================================================
#  FinPhaser Conda Environment
# ============================================================
#  All versions are pinned for reproducibility.
#  Build:    conda env create -f environment.yml
#  Activate: conda activate FinPhaser
#  Update:   conda env update -f environment.yml --prune
# ============================================================

channels:
  - conda-forge   # preferred — most packages most up to date here
  - bioconda      # ancestry_hmm, bcftools, htslib
  - defaults

dependencies:
  # ── Core language runtimes ──────────────────────────────────
  - python=3.12
  - r-base=3.6.3
  - git
  - gzip

  # ── Workflow manager ────────────────────────────────────────
  - nextflow=24.04.4

  # ── Bioinformatics tools ────────────────────────────────────
  - ancestry_hmm=1.0.2
  - bcftools=1.10
  - htslib=1.21           # provides bgzip and tabix (used by COMPRESS_VCF)
  - selam=0.9

  # ── C library (ancestry_hmm dependency) ────────────────────
  - gsl=2.7

  # ── Python packages ─────────────────────────────────────────
  - scikit-allel=1.3.7    # required by PhaseParents_VCF.py (allel module)
  - pandas=2.2.2
  - numpy=1.26.4
  # Note: pyyaml is intentionally omitted — all bin/ scripts use
  # stdlib-only YAML parsing to avoid import errors in edge cases.

  # ── R packages ──────────────────────────────────────────────
  - r-ggplot2=3.3.2
  - r-dplyr=1.0.2
  - r-readr=1.4.0 
  - r-stringr=1.4.0
  - r-tidyr=1.1.2 
  - r-data.table=1.13.2
  - r-naturalsort=0.1.3 
  - r-sys=3.4 
  - r-r.utils
