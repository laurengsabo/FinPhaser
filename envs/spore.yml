name: spore
# ============================================================
#  SPORE Conda Environment
# ============================================================
#  Upgraded from R 3.6.3 to R 4.3.3 so all packages can be
#  installed from conda-forge rather than requiring manual
#  CRAN installs at runtime.
#
#  Build:    conda env create -f envs/spore.yml
#  Activate: conda activate spore
#  Update:   conda env update -f envs/spore.yml --prune
# ============================================================

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── Python (needed by generate_spore_settings.py) ──────────
  - python=3.10

  # ── R runtime ───────────────────────────────────────────────
  - r-base=4.3.3

  # ── R packages required by SPORE.R ──────────────────────────
  - r-readr=2.1.5
  - r-stringr=1.5.1
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-data.table=1.15.4
  - r-ggplot2=3.5.1
  - r-naturalsort=0.1.3
  - r-r.utils=2.12.3
  - r-sys=3.4.2
  - r-mass=7.3_60

  # ── R packages required by this.path (SPORE dependency) ─────
  - r-this.path=2.3.1

  # ── Bioinformatics tools (used by SPORE internally) ─────────
  - bcftools=1.21
  - htslib=1.21

  # ── Compression ─────────────────────────────────────────────
  - gzip